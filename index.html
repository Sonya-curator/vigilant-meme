
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Node Map</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 50;
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    const loader = new THREE.TextureLoader();
    const nodes = [
      { img: '../images/sample1.jpg', link: 'https://example.com', position: [0, 0, 0] },
      { img: '../images/sample2.png', link: 'https://example.com', position: [20, 10, -10] }
    ];
    const nodeMeshes = [];
    nodes.forEach(node => {
      loader.load(node.img, texture => {
        const geometry = new THREE.PlaneGeometry(10, 10);
        const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(...node.position);
        mesh.userData = { link: node.link };
        scene.add(mesh);
        nodeMeshes.push(mesh);
      });
    });
    function connectNodes() {
      for (let i = 0; i < nodeMeshes.length; i++) {
        for (let j = i + 1; j < nodeMeshes.length; j++) {
          const geometry = new THREE.BufferGeometry().setFromPoints([
            nodeMeshes[i].position,
            nodeMeshes[j].position
          ]);
          const material = new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.2, transparent: true });
          const line = new THREE.Line(geometry, material);
          scene.add(line);
        }
      }
    }
    function animate() {
      requestAnimationFrame(animate);
      nodeMeshes.forEach(mesh => {
        mesh.position.x += (Math.random() - 0.5) * 0.05;
        mesh.position.y += (Math.random() - 0.5) * 0.05;
        mesh.position.z += (Math.random() - 0.5) * 0.05;
      });
      renderer.render(scene, camera);
    }
    window.addEventListener('click', (event) => {
      const mouse = new THREE.Vector2(
        (event.clientX / window.innerWidth) * 2 - 1,
        -(event.clientY / window.innerHeight) * 2 + 1
      );
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(nodeMeshes);
      if (intersects.length > 0) {
        const link = intersects[0].object.userData.link;
        window.open(link, '_blank');
      }
    });
    setTimeout(connectNodes, 1000);
    animate();
  </script>
</body>
</html>
